[project]
name = "churn-sustainability-analytics"
version = "0.1.0"
description = "E-Commerce and Sustainability Optimisation"
readme = "README.md"
authors = [{ name = "esterbleskadit", email = "esterbleskadit@gmail.com" }]

requires-python = ">=3.11"
dependencies = ["ipykernel>=7.3.0",
                "matplotlib>=3.11.1",
                "openpyxl>=3.1.5",
                "pandas>=3.0.5",
                "plotly>=7.0.0",
                "scikit-learn>=1.9.0",
                "seaborn>=0.13.2",
                "streamlit>=1.62.0",
                "streamlit-echarts>=0.7.0",
                "xgboost>=2.0.0"]

[project.scripts]
churn-sustainability-analytics = "churn_sustainability_analytics:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
