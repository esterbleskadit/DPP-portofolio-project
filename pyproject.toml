[project]
name = "my-portofolio-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "esterbleskadit", email = "esterbleskadit.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "streamlit>=1.62.0",
]

[project.scripts]
my-portofolio-project = "my_portofolio_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
